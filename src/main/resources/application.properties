spring.datasource.url=jdbc:mysql://localhost:3306/demo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Evita perder datos en cada arranque
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# (Opcional) Forzar dialecto si alguna vez vuelve a fallar la metadata
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false

# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

# Servidor
server.port=8080

#
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=true 
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

# Opcional (endurecimiento extra)
server.servlet.session.tracking-modes=cookie
server.servlet.session.persistent=false
